<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Gerentes - MoviPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass - Admin</a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Volver al Panel</a>
                <!-- guardas.js cierra la sesión y vuelve al index raíz -->
                <button id="btnCerrarSesion" type="button" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 class="h2 mb-4">Gestionar Gerentes de Cooperativas</h1>
        <p class="text-muted">Crea una cuenta de acceso para que el gerente pueda administrar su cooperativa.</p>

        <div id="alertContainer" class="mb-3"></div>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">Registrar Nuevo Gerente</div>
                    <div class="card-body">
                        <form id="formGerente">
                            <div class="mb-3">
                                <label for="cooperativa" class="form-label">Cooperativa a Asignar</label>
                                <select id="cooperativa" class="form-select" required>
                                    <option value="">Cargando cooperativas...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required>
                            </div>
                            <div class="mb-3">
                                <label for="cedula" class="form-label">Cédula</label>
                                <input type="text" class="form-control" id="cedula" required maxlength="10">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico (será su usuario)</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña Temporal</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnGuardar">Crear Gerente y Asignar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-secondary text-white text-center py-3 mt-auto">
        <div class="container"><p class="mb-0">&copy; 2026 MoviPass.</p></div>
    </footer>

    <script type="module">
        import { supabase } from '../../js/supabaseClient.js';
        import { mostrarAlerta } from '../../js/alertas.js';
        import { exigirRoles } from '../../js/guardas.js';

        // Solo el administrador puede ver esta página
        exigirRoles(['administrador']);

        const selectCoop = document.getElementById('cooperativa');
        const form = document.getElementById('formGerente');
        const btn = document.getElementById('btnGuardar');
        const TEXTO_BTN = 'Crear Gerente y Asignar';

        // 1. Cargar las cooperativas existentes en el select
        async function cargarCooperativas() {
            const { data, error } = await supabase.from('cooperativas').select('id, nombre').order('nombre');

            if (error) {
                console.error('Error al cargar cooperativas:', error);
                selectCoop.innerHTML = '<option value="">Error al cargar cooperativas</option>';
                return;
            }

            selectCoop.innerHTML = '<option value="">Selecciona una cooperativa</option>';
            data.forEach(c => {
                selectCoop.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            });
        }
        cargarCooperativas();

        // Restaura la sesión del administrador
        async function restaurarAdmin(adminSession) {
            if (!adminSession) return;
            const { error } = await supabase.auth.setSession({
                access_token: adminSession.access_token,
                refresh_token: adminSession.refresh_token
            });
            if (error) throw error;
        }

        // 2. Crear el usuario y asignarlo
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const coopId = selectCoop.value;
            if (!coopId) {
                mostrarAlerta('Por favor, selecciona una cooperativa.', 'warning');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creando usuario...';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            // Guardamos la sesión actual del administrador ANTES del signUp
            const { data: { session: adminSession } } = await supabase.auth.getSession();

            if (!adminSession) {
                mostrarAlerta('Tu sesión de administrador expiró. Inicia sesión de nuevo.', 'danger');
                btn.disabled = false;
                btn.textContent = TEXTO_BTN;
                return;
            }

            try {
                // A. Crear el usuario en Supabase Auth (el trigger crea el perfil como 'cliente')
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            cedula: document.getElementById('cedula').value.trim(),
                            nombres: document.getElementById('nombres').value.trim(),
                            apellidos: document.getElementById('apellidos').value.trim(),
                            telefono: '0999999999'
                        }
                    }
                });

                if (authError) throw authError;
                if (!authData.user) throw new Error('No se pudo crear el usuario.');

                const nuevoId = authData.user.id;

                // B. RESTAURAR LA SESIÓN DE ADMIN INMEDIATAMENTE
                //    (signUp cambia la sesión al usuario nuevo)
                await restaurarAdmin(adminSession);

                // C. Esperar un momento al trigger
                await new Promise(r => setTimeout(r, 1000));

                // D. Subir el rol a 'cooperativa' (ya como administrador)
                const { data: filas, error: rolError } = await supabase
                    .from('perfiles')
                    .update({ rol: 'cooperativa' })
                    .eq('id', nuevoId)
                    .select('id');

                if (rolError) throw rolError;
                if (!filas || filas.length === 0) {
                    throw new Error('No se pudo actualizar el rol. Verifica que tu usuario tenga rol "administrador" y que el trigger exista.');
                }

                // E. Asignar la cooperativa al gerente
                const { error: asignError } = await supabase
                    .from('cooperativas_usuarios')
                    .insert([{ cooperativa_id: coopId, perfil_id: nuevoId }]);

                if (asignError) throw asignError;

                // F. Éxito
                mostrarAlerta('¡Gerente creado y asignado a la cooperativa con éxito!', 'success');
                form.reset();
                selectCoop.value = '';

            } catch (error) {
                console.error(error);
                mostrarAlerta('Error: ' + error.message, 'danger');
                // Si falló antes de restaurar, intentamos volver a ser admin
                try { await restaurarAdmin(adminSession); } catch (_) { /* ignorar */ }
            } finally {
                btn.disabled = false;
                btn.textContent = TEXTO_BTN;
            }
        });
    </script>
</body>
</html>
