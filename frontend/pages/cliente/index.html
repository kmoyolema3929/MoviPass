<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cliente - MoviPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Panel de Cliente</h1>
            <!-- Botón de cerrar sesión -->
            <button id="btnCerrarSesion" class="btn btn-danger">Cerrar Sesión</button>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <p>Si estás viendo esta pantalla, significa que la guarda de seguridad te reconoció como cliente autorizado.</p>
            </div>
        </div>
    </div>

    <!-- Script de seguridad para proteger la ruta -->
    <script type="module">
        import { exigirRoles } from '../../js/guardas.js';
        
        // Bloquea la página exigiendo que el rol sea exclusivamente "cliente"
        exigirRoles(['cliente']);
    </script>
</body>
</html>
