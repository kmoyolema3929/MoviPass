<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Selección de asientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">MoviPass</span>
      <span class="navbar-text small">Compra de boletos</span>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-1">Selecciona tus asientos</h1>
    <p class="text-secondary mb-4">Quito → Guayaquil · Salida 08:00 · Precio por asiento: $<span id="precioUnitario"></span></p>

    <div class="row g-4">
      <!-- Estructura del bus -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <p class="text-secondary mb-0">Aquí se mostrará la estructura del bus.</p>
          </div>
        </div>
      </div>

      <!-- Resumen -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Resumen de tu compra</div>
          <div class="card-body">
            <p class="text-secondary mb-0">Aún no has seleccionado asientos.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
