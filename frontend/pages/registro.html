<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MoviPass</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal (Registro) -->
    <main class="container my-5 d-flex align-items-center justify-content-center" style="flex: 1;">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Tarjeta de Registro -->
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold" style="color: var(--primary-color);">Crea tu cuenta</h2>
                            <p class="text-muted">Únete a MoviPass y compra tus pasajes al instante</p>
                        </div>

                        <!-- Formulario con validación nativa -->
                        <form class="row g-3">
                            <!-- Nombres y Apellidos -->
                            <div class="col-md-6">
                                <label for="nombresInput" class="form-label fw-bold">Nombres</label>
                                <input type="text" class="form-control" id="nombresInput" placeholder="Ej. Juan Carlos" required>
                            </div>
                            <div class="col-md-6">
                                <label for="apellidosInput" class="form-label fw-bold">Apellidos</label>
                                <input type="text" class="form-control" id="apellidosInput" placeholder="Ej. Pérez Gómez" required>
                            </div>

                            <!-- Cédula y Teléfono -->
                            <div class="col-md-6">
                                <label for="cedulaInput" class="form-label fw-bold">Cédula</label>
                                <input type="text" class="form-control" id="cedulaInput" placeholder="10 dígitos" pattern="[0-9]{10}" title="Debe contener 10 números" required>
                            </div>
                            <div class="col-md-6">
                                <label for="telefonoInput" class="form-label fw-bold">Teléfono</label>
                                <input type="tel" class="form-control" id="telefonoInput" placeholder="099..." required>
                            </div>

                            <!-- Correo -->
                            <div class="col-12">
                                <label for="emailRegistro" class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control" id="emailRegistro" placeholder="ejemplo@correo.com" required>
                            </div>
                            
                            <!-- Contraseña -->
                            <div class="col-12 mb-3">
                                <label for="passRegistro" class="form-label fw-bold">Contraseña</label>
                                <input type="password" class="form-control" id="passRegistro" placeholder="Mínimo 8 caracteres" minlength="8" required>
                            </div>

                            <!-- Botón de Registro -->
                            <div class="col-12 d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" style="background-color: var(--primary-color); border: none;">
                                    Registrarse
                                </button>
                            </div>
                            
                            <!-- Link al login -->
                            <div class="col-12 text-center mt-3">
                                <span class="text-muted">¿Ya tienes una cuenta? <a href="login.html" style="color: var(--primary-color);">Inicia sesión aquí</a></span>
                            </div>
                        </form>
                        
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Pie de Página -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--secondary-color);">
        <div class="container">
            <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de Supabase para el Registro -->
    <script type="module" src="../js/registro.js"></script>
</body>
</html>
