<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recaudación en ruta - MoviPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/usuario-bus.css">
    <style>
        @media print {
            .no-imprimir { display: none !important; }
            body { background: #fff; }
        }
    </style>
</head>
<body class="app-bus d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark no-imprimir">
        <div class="container">
            <a id="marca" class="navbar-brand fw-bold" href="index.html">MoviPass - Bus</a>
            <div class="d-flex gap-2">
                <a id="btnVolver" href="index.html" class="btn btn-outline-light btn-sm">&larr; Volver</a>
                <button id="btnCerrarSesion" type="button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-3 flex-grow-1" style="max-width: 760px;">
        <h1 class="h3 mb-1">Recaudación en ruta</h1>
        <p class="mb-3">Solo los pasajeros que subieron en el camino (venta EN_RUTA), cobrados en efectivo por el usuario bus.</p>

        <div id="alertContainer" class="no-imprimir" role="alert" aria-live="polite"></div>

        <section id="reporte" class="d-none">
            <div class="card mb-3">
                <div class="card-body">
                    <dl id="datosViaje" class="row mb-0"></dl>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body text-center">
                    <div class="fw-bold">Total en efectivo</div>
                    <div id="totalGrande" class="display-5 fw-bold"></div>
                    <div id="pasajerosTotal" class="fs-5 fw-semibold"></div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header bg-white"><h2 class="h5 mb-0">Por tarifa</h2></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead class="table-dark"><tr><th>Tarifa</th><th class="text-end">Pasajeros</th><th class="text-end">Total</th></tr></thead>
                            <tbody id="tablaTarifas"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header bg-white"><h2 class="h5 mb-0">Detalle</h2></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm mb-0 align-middle">
                            <thead class="table-dark">
                                <tr><th>Hora</th><th>Asiento</th><th>Pasajero</th><th>Tarifa</th><th>Sube en</th><th class="text-end">Precio</th></tr>
                            </thead>
                            <tbody id="tablaDetalle"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 no-imprimir mb-3">
                <button id="btnPdf" type="button" class="btn btn-dark btn-xl">Descargar PDF</button>
                <button id="btnImprimir" type="button" class="btn btn-outline-dark btn-xl">Imprimir</button>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto no-imprimir">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="recaudacion.js"></script>
</body>
</html>
