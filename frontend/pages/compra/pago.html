<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Pago con Transferencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">MoviPass</span>
      <span class="navbar-text small">Pago de boletos</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <div class="card shadow-sm mt-5">
          <div class="card-header bg-white fw-semibold text-center py-3">
            <h3 class="h4 mb-0">Sube tu comprobante de pago</h3>
          </div>
          <div class="card-body">
            <p class="text-muted small text-center mb-4">
              Realiza la transferencia a la cuenta del banco y sube el comprobante en formato imagen (JPG, PNG) o PDF.
            </p>

            <form id="formPago" class="needs-validation" novalidate>
              
              <div class="mb-4">
                <label for="comprobante" class="form-label fw-bold">Selecciona tu comprobante</label>
                <input class="form-control" type="file" id="comprobante" accept="image/*,application/pdf" required>
                <div class="invalid-feedback">
                  Por favor, selecciona un archivo válido (Imagen o PDF).
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg" id="btnSubirPago">
                  Confirmar Pago
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/pago.js"></script>
</body>
</html>
