<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Resumen de Compra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">MoviPass</span>
      <span class="navbar-text small">Compra de boletos</span>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Resumen de tu compra</h1>

    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <!-- Tarjeta de Información del Viaje -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white fw-semibold">Detalles del Viaje</div>
          <div class="card-body">
            <p class="mb-1"><strong>Ruta:</strong> Quito → Guayaquil</p>
            <p class="mb-1"><strong>Fecha:</strong> 26 de Octubre, 2026</p>
            <p class="mb-0"><strong>Hora de salida:</strong> 08:00 AM</p>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
