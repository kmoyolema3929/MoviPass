<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Tu boleto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../../index.html">MoviPass</a>
      <div class="d-flex align-items-center gap-2">
        <a href="historial.html" class="btn btn-outline-light btn-sm d-none d-sm-inline">Mis compras</a>
        <button id="btnCerrarSesion" type="button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5 flex-grow-1">
    <div id="alertContainer" role="alert" aria-live="polite"></div>

    <div id="contenidoCompra">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" id="tituloBoleto">Tu boleto</h1>
        <span id="estadoCompra" class="badge text-bg-secondary">Cargando...</span>
      </div>

      <div id="avisoCompra" class="alert" role="alert"></div>

      <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">Datos de la compra</div>
        <div class="card-body">
          <div id="resumenCompra"></div>
        </div>
      </div>

      <h2 class="h4 mb-3">Boletos</h2>
      <div id="listaBoletos"></div>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <a href="historial.html" class="btn btn-outline-primary">Mis compras</a>
        <a href="../cliente/buscar.html" class="btn btn-primary">Buscar otro viaje</a>
      </div>
    </div>
  </main>

  <footer class="bg-secondary text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js/boleto.js"></script>
</body>
</html>
