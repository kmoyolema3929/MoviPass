<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Tu Boleto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Librería para generar el QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">MoviPass</span>
      <span class="navbar-text small">Tu boleto</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <div class="card shadow-sm mt-4 text-center">
          <div class="card-header bg-success text-white fw-semibold py-3">
            <h3 class="h4 mb-0">¡Compra Exitosa!</h3>
          </div>
          <div class="card-body">
            <p class="text-muted mb-4">Presenta este código QR al momento de abordar el bus.</p>
            
            <!-- Contenedor del Código QR -->
            <div id="contenedorQR" class="d-flex justify-content-center mb-4"></div>
            
            <p class="fw-bold">ID del Boleto: <span id="idBoleto"></span></p>
            
            <div class="d-grid gap-2 mt-4">
              <button id="btnDescargar" class="btn btn-primary">Descargar Boleto</button>
              <a href="../../index.html" class="btn btn-outline-secondary">Volver al inicio</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/boleto.js"></script>
</body>
</html>
