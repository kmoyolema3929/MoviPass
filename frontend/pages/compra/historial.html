<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoviPass | Historial de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">MoviPass</span>
      <span class="navbar-text small">Mis compras</span>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Historial de Compras</h1>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Tus boletos</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>ID del Boleto</th>
                <th>Fecha de Compra</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaHistorial">
              <!-- Aquí JS inyectará los boletos -->
              <tr>
                <td colspan="5" class="text-center py-3 text-muted">Cargando historial...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/historial.js"></script>
</body>
</html>
