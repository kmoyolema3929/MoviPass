<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - MoviPass</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal (Inicio) -->
    <main class="container my-5">
        
        <!-- Título de bienvenida -->
        <div class="row justify-content-center text-center mb-5">
            <div class="col-md-8">
                <h1 class="fw-bold text-primary" style="color: var(--primary-color) !important;">Bienvenido a MoviPass</h1>
                <p class="lead text-muted">Encuentra, reserva y compra tus pasajes de bus al mejor precio y sin filas.</p>
            </div>
        </div>

        
<!-- Tarjeta del buscador de viajes -->
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card tarjeta-busqueda">
    <div class="card-body">
                <form id="form-busqueda"
                      class="row g-3 align-items-end"
                      aria-label="Búsqueda de viajes">

                    <!-- Origen -->
                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="origen" class="form-label fw-bold">Origen</label>
                        <select id="origen" name="origen" class="form-select" required>
                            <option value="" selected disabled>¿De dónde sales?</option>
                            <option value="1">Ambato</option>
                            <option value="2">Quito</option>
                            <option value="3">Guayaquil</option>
                        </select>
                    </div>

                    <!-- Destino -->
                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="destino" class="form-label fw-bold">Destino</label>
                        <select id="destino" name="destino" class="form-select" required>
                            <option value="" selected disabled>¿A dónde vas?</option>
                            <option value="1">Ambato</option>
                            <option value="2">Quito</option>
                            <option value="3">Guayaquil</option>
                        </select>
                    </div>

                    <!-- Fecha de viaje -->
                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="fecha" class="form-label fw-bold">Fecha de viaje</label>
                        <input id="fecha" name="fecha" type="date"
                               class="form-control" required>
                    </div>

                    <!-- Botón Buscar -->
                    <div class="col-12 col-md-6 col-lg-3 d-grid">
                        <button id="buscar-viajes" type="submit"
                                class="btn btn-primary"
                                style="background-color: var(--primary-color); border: none;">
                            Buscar
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>


    </main>

    <!-- Pie de Página -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--secondary-color);">
        <div class="container">
            <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // Usar la fecha local para evitar desfases con la zona horaria UTC.
        const hoy = new Date();
        const anio = hoy.getFullYear();
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const dia = String(hoy.getDate()).padStart(2, '0');
        document.getElementById('fecha').min = `${anio}-${mes}-${dia}`;
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
