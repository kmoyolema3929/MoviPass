<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviPass - Generar Hoja de Ruta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Generar Hoja de Ruta</h2>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="formHojaRuta">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="selectFrecuencia" class="form-label">Frecuencia</label>
                            <select id="selectFrecuencia" class="form-select" required>
                                <option value="">Seleccione una frecuencia...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="selectBus" class="form-label">Asignar Bus</label>
                            <select id="selectBus" class="form-select" required>
                                <option value="">Seleccione un bus...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="fechaViaje" class="form-label">Fecha del Viaje</label>
                            <input type="date" id="fechaViaje" class="form-control" required>
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <button type="submit" class="btn btn-primary">Generar Hoja de Ruta</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Detalle de la Hoja de Ruta</h4>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Parada / Destino</th>
                                <th>Hora Estimada</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHojaRuta">
                            <tr>
                                <td colspan="4" class="text-center py-3 text-muted">Seleccione los parámetros y genere la hoja de ruta.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="hojas_ruta.js"></script>
</body>
</html>
