<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Frecuencias - MoviPass</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Gestión de Frecuencias</h2>
                <p class="text-muted mb-0">Módulo de Frecuencias y hojas de ruta</p>
            </div>
            <!-- Botón para Nueva Frecuencia -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFrecuencia">
                + Nueva Frecuencia
            </button>
        </div>

        <!-- Tabla de Frecuencias -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Frecuencias Registradas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Hora de Salida</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaFrecuencias">
                            <tr>
                                <td>1</td>
                                <td>Ambato</td>
                                <td>Quito</td>
                                <td>08:00 AM</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-warning me-1">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Ambato</td>
                                <td>Guayaquil</td>
                                <td>10:30 AM</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-warning me-1">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal / Formulario para Crear y Editar Frecuencias -->
    <div class="modal fade" id="modalFrecuencia" tabindex="-1" aria-labelledby="modalFrecuenciaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalFrecuenciaLabel">Registrar Nueva Frecuencia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formFrecuencia">
                        <div class="mb-3">
                            <label for="origen" class="form-label">Ciudad de Origen</label>
                            <input type="text" class="form-control" id="origen" placeholder="Ej. Ambato" required>
                        </div>
                        <div class="mb-3">
                            <label for="destino" class="form-label">Ciudad de Destino</label>
                            <input type="text" class="form-control" id="destino" placeholder="Ej. Quito" required>
                        </div>
                        <div class="mb-3">
                            <label for="hora" class="form-label">Hora de Salida</label>
                            <input type="time" class="form-control" id="hora" required>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success">Guardar Frecuencia</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de refactorización para control del modal y formulario -->
    <script>
        document.getElementById('formFrecuencia').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Frecuencia procesada correctamente.');
            var modalElement = document.getElementById('modalFrecuencia');
            var modalInstance = bootstrap.Modal.getInstance(modalElement);
            modalInstance.hide();
            this.reset();
        });
    </script>
</body>
</html>
