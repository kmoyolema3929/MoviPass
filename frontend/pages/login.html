<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MoviPass</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<!-- d-flex + flex-column + min-vh-100: así el footer sí queda abajo (con mt-auto) y el login se centra -->
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">MoviPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal (login) -->
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="h2 fw-bold" style="color: var(--primary-color);">Bienvenido de nuevo</h1>
                            <p class="text-muted mb-0">Ingresa a tu cuenta de MoviPass</p>
                        </div>

                        <form id="formLogin">
                            <!-- Aquí js/alertas.js muestra los mensajes; role="alert" para lectores de pantalla -->
                            <div id="alertContainer" class="mb-3" role="alert" aria-live="polite"></div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control form-control-lg" id="emailInput"
                                       name="email" placeholder="ejemplo@correo.com"
                                       autocomplete="email" inputmode="email" autofocus required>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="passwordInput" class="form-label fw-bold">Contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg" id="passwordInput"
                                           name="password" placeholder="Tu contraseña"
                                           autocomplete="current-password" minlength="6" required>
                                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePass"
                                            aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
                                        👁️
                                    </button>
                                </div>
                            </div>

                            <!-- Botón (el id permite que login.js lo deshabilite mientras carga) -->
                            <div class="d-grid">
                                <button type="submit" id="btnLogin" class="btn btn-primary btn-lg"
                                        style="background-color: var(--primary-color); border: none;">
                                    Iniciar sesión
                                </button>
                            </div>

                            <!-- Link a registro -->
                            <div class="text-center mt-4">
                                <span class="text-muted">¿No tienes una cuenta?
                                    <a href="registro.html" style="color: var(--primary-color);">Regístrate aquí</a>
                                </span>
                            </div>
                        </form>
                    </div>
                </div>

                <p class="text-center mt-3 mb-0">
                    <a href="../index.html" class="text-muted small">&larr; Volver al inicio</a>
                </p>

            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--secondary-color);">
        <div class="container">
            <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de Supabase para el login -->
    <script type="module" src="../js/login.js"></script>
</body>
</html>
