<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de ventas - MoviPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass - Oficinista</a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Volver al panel</a>
                <button id="btnCerrarSesion" type="button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5 flex-grow-1">
        <h1 class="h3 mb-1">Historial de ventas y pagos</h1>
        <p class="text-muted">Ventas de ventanilla y compras de clientes de tu cooperativa.</p>

        <div id="alertContainer" role="alert" aria-live="polite"></div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="filtroEstado" class="form-label">Estado</label>
                        <select id="filtroEstado" class="form-select">
                            <option value="">Todos</option>
                            <option value="aprobada">Aprobada</option>
                            <option value="pendiente_validacion">Pendiente de validación</option>
                            <option value="pendiente_comprobante">Esperando comprobante</option>
                            <option value="rechazada">Rechazada</option>
                            <option value="vencida">Vencida</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtroDesde" class="form-label">Desde</label>
                        <input type="date" id="filtroDesde" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="filtroHasta" class="form-label">Hasta</label>
                        <input type="date" id="filtroHasta" class="form-control">
                    </div>
                    <div class="col-md-3 d-grid">
                        <button id="btnBuscar" type="button" class="btn btn-primary">Buscar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha</th>
                                <th>Viaje</th>
                                <th>Método</th>
                                <th>Estado</th>
                                <th class="text-end">Total</th>
                                <th class="text-center">Boletos</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial">
                            <tr><td colspan="6" class="text-center py-3 text-muted">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between flex-wrap gap-2">
                <span class="text-muted small" id="resumenLista"></span>
                <strong id="totalAprobado"></strong>
            </div>
        </div>
    </main>

    <footer class="bg-secondary text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="historial.js"></script>
</body>
</html>
