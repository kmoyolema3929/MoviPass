<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Base - MoviPass</title>
    
    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados con variables CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Barra de Navegación Reutilizable -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal (Aquí irá el contenido de cada pantalla) -->
    <main class="container my-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center">Contenido de la Pantalla</h1>
                <p class="text-center text-muted">Copia este archivo html para crear nuevas vistas.</p>
            </div>
        </div>
    </main>

    <!-- Pie de Página Reutilizable -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--secondary-color);">
        <div class="container">
            <p class="mb-0">&copy; 2026 MoviPass. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
