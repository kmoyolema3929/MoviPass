<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Oficinistas - MoviPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MoviPass - Cooperativa</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Volver al Panel</a>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 class="h2 mb-4">Gestionar Oficinistas</h1>
        <p class="text-muted">Crea y administra las cuentas de tu personal.</p>

        <div id="alertContainer" class="mb-3"></div>

        <div class="row g-4">
            <!-- Formulario de creación -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">Registrar Nuevo Oficinista</div>
                    <div class="card-body">
                        <form id="formOficinista">
                            <div class="mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required>
                            </div>
                            <div class="mb-3">
                                <label for="cedula" class="form-label">Cédula</label>
                                <input type="text" class="form-control" id="cedula" required maxlength="10">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña Temporal</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnGuardar">Crear Oficinista</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de oficinistas -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">Oficinistas Registrados</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Cédula</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaOficinistas">
                                    <tr>
                                        <td colspan="4" class="text-center py-3 text-muted">Cargando oficinistas...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-secondary text-white text-center py-3 mt-auto">
        <div class="container"><p class="mb-0">&copy; 2026 MoviPass.</p></div>
    </footer>

    <script type="module">
        import { supabase } from '../../js/supabaseClient.js';
        import { mostrarAlerta } from '../../js/alertas.js';

        const form = document.getElementById('formOficinista');
        const btn = document.getElementById('btnGuardar');
        const tbody = document.getElementById('tablaOficinistas');
        let miCooperativaId = null;

        // 1. Cargar la lista directamente desde perfiles
        async function cargarOficinistas() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            // Obtener la cooperativa del gerente (por si acaso)
            const { data: coop } = await supabase
                .from('cooperativas_usuarios')
                .select('cooperativa_id')
                .eq('perfil_id', session.user.id)
                .single();
            
            if (coop) miCooperativaId = coop.cooperativa_id;

            // CONSULTA DIRECTA: Traer a todos los usuarios con rol 'oficinista'
            const { data: perfiles, error } = await supabase
                .from('perfiles')
                .select('id, nombres, apellidos, cedula, estado')
                .eq('rol', 'oficinista');

            if (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-danger">Error al cargar la lista.</td></tr>';
                return;
            }

            tbody.replaceChildren();

            if (!perfiles || perfiles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">No hay oficinistas registrados aún.</td></tr>';
                return;
            }

            perfiles.forEach(p => {
                const tr = document.createElement('tr');
                const badge = p.estado === 'activo' ? 'bg-success' : 'bg-danger';
                const badgeTexto = p.estado === 'activo' ? 'Activo' : 'Suspendido';
                const btnTexto = p.estado === 'activo' ? 'Suspender' : 'Activar';
                const btnClase = p.estado === 'activo' ? 'btn-outline-warning' : 'btn-outline-success';

                tr.innerHTML = `
                    <td>${p.nombres} ${p.apellidos}</td>
                    <td>${p.cedula}</td>
                    <td><span class="badge ${badge}">${badgeTexto}</span></td>
                    <td>
                        <button class="btn btn-sm ${btnClase} me-1" onclick="cambiarEstadoOficinista('${p.id}', '${p.estado}')">${btnTexto}</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarOficinista('${p.id}')">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. Cambiar estado (Suspender/Activar)
        window.cambiarEstadoOficinista = async (perfilId, estadoActual) => {
            const nuevoEstado = estadoActual === 'activo' ? 'suspendido' : 'activo';
            if (!confirm(`¿Estás seguro de ${nuevoEstado === 'activo' ? 'activar' : 'suspender'} a este oficinista?`)) return;

            const { error } = await supabase
                .from('perfiles')
                .update({ estado: nuevoEstado })
                .eq('id', perfilId);

            if (error) {
                mostrarAlerta('Error: ' + error.message, 'danger');
                return;
            }

            mostrarAlerta('Estado actualizado.', 'success');
            cargarOficinistas();
        };

        // 3. Eliminar oficinista (quitar de la cooperativa)
        window.eliminarOficinista = async (perfilId) => {
            if (!confirm('¿Estás seguro de quitar a este oficinista de tu cooperativa?')) return;

            if (!miCooperativaId) {
                mostrarAlerta('No se pudo identificar la cooperativa.', 'danger');
                return;
            }

            const { error } = await supabase
                .from('cooperativas_usuarios')
                .delete()
                .eq('cooperativa_id', miCooperativaId)
                .eq('perfil_id', perfilId);

            if (error) {
                mostrarAlerta('Error: ' + error.message, 'danger');
                return;
            }

            mostrarAlerta('Oficinista removido de la cooperativa.', 'success');
            cargarOficinistas();
        };

        // 4. Crear nuevo oficinista
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Creando usuario...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data: { session: gerenteSession } } = await supabase.auth.getSession();
            if (!gerenteSession) {
                mostrarAlerta('No hay una sesión activa.', 'danger');
                btn.disabled = false;
                btn.textContent = 'Crear Oficinista';
                return;
            }

            try {
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            cedula: document.getElementById('cedula').value,
                            nombres: document.getElementById('nombres').value,
                            apellidos: document.getElementById('apellidos').value,
                            telefono: '0999999999' 
                        }
                    }
                });

                if (authError) throw authError;
                if (!authData.user) throw new Error("No se pudo crear el usuario.");

                // Restaurar la sesión del gerente para no perder permisos
                await supabase.auth.setSession(gerenteSession);
                await new Promise(r => setTimeout(r, 1500));

                // Asignar el rol y la cooperativa con la función RPC
                const { error: rpcError } = await supabase.rpc('asignar_usuario_a_cooperativa', {
                    p_usuario_id: authData.user.id,
                    p_cooperativa_id: miCooperativaId,
                    p_rol: 'oficinista'
                });

                if (rpcError) throw rpcError;

                mostrarAlerta('¡Oficinista creado con éxito!', 'success');
                form.reset();
                cargarOficinistas();

            } catch (error) {
                console.error(error);
                mostrarAlerta('Error: ' + error.message, 'danger');
                if (gerenteSession) await supabase.auth.setSession(gerenteSession);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Crear Oficinista';
            }
        });

        // Iniciar la carga
        cargarOficinistas();
    </script>
</body>
</html>
